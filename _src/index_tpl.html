<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자격증 교본</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--text:#121a22;--text-2:#4f5d6b;--line:#d6dce2;--surface:#f3f5f7;--ease-out:cubic-bezier(.23,1,.32,1);
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--text);background:#fff;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;line-height:1.7}
:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}
header{padding:120px 0 96px}
h1{font-size:clamp(44px,7vw,96px);letter-spacing:-.04em;line-height:1.08;margin:0;font-weight:800;text-wrap:balance}
.lead{font-size:clamp(18px,1.8vw,22px);color:var(--text-2);max-width:32em;margin:28px 0 0}
.grp{margin:0 0 96px}
.grp h2{font-size:clamp(26px,3vw,34px);letter-spacing:-.02em;margin:0;font-weight:800}
.gd{color:var(--text-2);margin:6px 0 20px;font-size:16px}
ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--text)}
li{border-bottom:1px solid var(--line)}
a.row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:32px;align-items:center;padding:28px 0;color:inherit;text-decoration:none}
.sw{width:96px;height:96px;border-radius:4px;display:grid;place-items:end start;padding:12px;color:#fff;font-weight:700;font-size:15px;
  transform-origin:left center;transition:transform 260ms var(--ease-out)}
.row h3{font-size:clamp(22px,2.4vw,30px);letter-spacing:-.02em;margin:0;line-height:1.2}
.row p{margin:8px 0 0;color:var(--text-2);font-size:17px;max-width:36em}
.go{font-weight:600;font-size:16px;white-space:nowrap;display:flex;align-items:center;gap:10px}
.go svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;transition:transform 220ms var(--ease-out)}
@media (hover:hover) and (pointer:fine){ a.row:hover .sw{transform:scaleX(1.12)} a.row:hover .go svg{transform:translateX(5px)} }
a.row:active .go svg{transform:translateX(2px)}
.note{padding:64px 0 120px;color:var(--text-2);font-size:15px;max-width:44em}
.note b{color:var(--text)}
.js .in{opacity:0;transform:translateY(18px);transition:opacity 520ms var(--ease-out),transform 520ms var(--ease-out)}
.js .in.on{opacity:1;transform:none}
@media (max-width:640px){
  header{padding:72px 0 56px}
  a.row{grid-template-columns:56px minmax(0,1fr);gap:18px;padding:28px 0}
  .sw{width:56px;height:56px;font-size:12px;padding:8px}
  .go{grid-column:2;font-size:15px}
}
@media (prefers-reduced-motion:reduce){ .js .in{transform:none;transition:opacity 200ms linear} .sw,.go svg{transition:none} }
</style>
<script>document.documentElement.classList.add('js')</script>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="in">자격증 교본 {{N}}권</h1>
    <p class="lead in">개발, 데이터·AI, 보안·인프라 자격증의 시험 범위 전체를 정리하고 단원마다 확인 문제를 붙였다. 필요한 단원만 골라 A4 PDF로 저장할 수 있다.</p>
  </header>
  {{ROWS}}
  <p class="note in"><b>PDF로 저장하는 법</b> — 각 교본 위쪽의 <b>PDF로 저장</b>을 눌러 단원을 고르거나, 단원 제목 아래 <b>이 장만 PDF로</b>를 누른다. 인쇄 창에서 대상을 <b>PDF로 저장</b>, 용지를 A4로 고르면 된다. 2026년 11월 기준으로 정리했으며, 시험 일정과 응시료는 접수 전 공식 사이트에서 다시 확인하자.</p>
</div>
<script>
(function(){var els=document.querySelectorAll('.in');els.forEach(function(e,i){setTimeout(function(){e.classList.add('on')},80+i*80)});})();
</script>
</body>
</html>
